<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos | Focaccias Artesanales</title>
    <style>
        /* Tipografías elegantes */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Montserrat:wght@300;400;600&display=swap');

        :root {
            --sage-green: #63825D;
            --light-sage: #e9ece8;
            --beige: #F7F5F0;
            --dark-green: #2B3A28;
            --border-color: #d1d8ce;
            --soft-red: #C57B7B;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--beige);
            color: var(--dark-green);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .form-container {
            background-color: white;
            max-width: 500px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(99, 130, 93, 0.15);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .form-header {
            background-color: var(--light-sage);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid var(--sage-green);
        }

        .form-header svg {
            margin-bottom: 10px;
        }

        .form-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin: 0;
            color: var(--dark-green);
        }

        .form-header p {
            font-size: 13px;
            color: var(--sage-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 5px 0 0 0;
            font-weight: 600;
        }

        form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark-green);
        }

        input[type="text"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--sage-green);
            box-shadow: 0 0 0 3px rgba(99, 130, 93, 0.2);
            background-color: white;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .order-section {
            background-color: var(--light-sage);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px dashed var(--sage-green);
        }

        .order-item {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            position: relative;
        }

        .remove-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: var(--soft-red);
            font-size: 18px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            line-height: 1;
        }

        .promo-desc {
            display: none;
            font-size: 13px;
            color: var(--dark-green);
            background-color: #f4f6f3;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid var(--sage-green);
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .promo-desc label {
            color: var(--sage-green);
            margin-bottom: 5px;
        }

        .disclaimer-zona {
            font-size: 12px;
            color: var(--sage-green);
            margin-top: 8px;
            margin-bottom: 0;
            font-style: italic;
            line-height: 1.4;
        }

        .add-item-btn {
            width: 100%;
            background-color: transparent;
            color: var(--sage-green);
            border: 1px dashed var(--sage-green);
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background-color 0.3s ease;
        }

        .add-item-btn:hover {
            background-color: rgba(99, 130, 93, 0.1);
        }

        .total-price {
            font-size: 18px;
            font-weight: 600;
            text-align: right;
            margin-top: 15px;
            color: var(--dark-green);
        }

        button[type="submit"] {
            width: 100%;
            background-color: var(--sage-green);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #516b4c;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(43, 58, 40, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background-color: var(--beige);
            width: 85%;
            max-width: 350px;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            border: 2px solid var(--sage-green);
        }

        .modal-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .modal-box h2 {
            font-family: 'Playfair Display', serif;
            color: var(--dark-green);
            margin: 0 0 10px 0;
            font-size: 24px;
        }

        .modal-box p {
            font-size: 14px;
            color: var(--dark-green);
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .modal-btn {
            background-color: var(--sage-green);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
        }

    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <svg width="40" height="40" viewBox="0 0 100 100">
                <path d="M50,90 Q45,50 55,10" stroke="#63825D" stroke-width="3" fill="none"/>
                <ellipse cx="52" cy="70" rx="4" ry="12" fill="#63825D" transform="rotate(30 52 70)"/>
                <ellipse cx="48" cy="55" rx="4" ry="12" fill="#63825D" transform="rotate(-30 48 55)"/>
                <ellipse cx="54" cy="40" rx="4" ry="12" fill="#63825D" transform="rotate(25 54 40)"/>
                <ellipse cx="46" cy="25" rx="4" ry="12" fill="#63825D" transform="rotate(-25 46 25)"/>
            </svg>
            <h1>Hacé tu pedido</h1>
            <p>Focaccias Artesanales</p>
        </div>

        <form id="pedidoForm">
            <div class="form-group">
                <label for="nombre">Nombre y Apellido</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: María Pérez">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono (WhatsApp)</label>
                <input type="tel" id="telefono" name="telefono" required placeholder="Ej: 1123456789">
            </div>

            <div class="form-group">
                <label for="zona">Zona de entrega</label>
                <select id="zona" name="zona" required onchange="manejarCambioZona(this)">
                    <option value="" disabled selected>Elegí una opción...</option>
                    <option value="Vila Terra">Vila Terra</option>
                    <option value="Centro Comercial Nordelta">Centro Comercial Nordelta</option>
                    <option value="Lirios del Talar">Lirios del Talar</option>
                    <option value="Terrazas/Casas de Santa Maria">Terrazas/Casas de Santa Maria</option>
                    <option value="Barrio de Villa Nueva">Barrio de Villa Nueva</option>
                    <option value="Otro">Otro</option>
                </select>

                <p class="disclaimer-zona">⚠️ Importante: Las entregas están sujetas a coordinación previa de días y horarios.</p>

                <div id="barrioEspecificoContainer" style="display: none; margin-top: 10px;">
                    <input type="text" id="barrioEspecifico" name="barrioEspecifico" placeholder="¿Dónde? (Ej: San Isidro Labrador u otra zona)">
                </div>
            </div>

            <div class="order-section">
                <div id="items-container">
                    <div class="order-item">
                        <div class="form-group">
                            <label>Formato</label>
                            <select class="formato-select" required onchange="manejarCambioFormato(this)">
                                <option value="" disabled selected>Elegí una opción...</option>
                                <option value="Individual">Individual (15x12) - $4.200</option>
                                <option value="Familiar">Familiar (31x21) - $12.000</option>
                            </select>
                        </div>

                        <div class="form-group sabor-group">
                            <label>Sabor/es</label>
                            <select class="sabor-select" required>
                                <option value="" disabled selected>Elegí un sabor...</option>
                                <option value="Clásica (Romero y Sal)">🌿 Clásica (Romero y Sal)</option>
                                <option value="Papa y Parmesano">🧀 Papa y Parmesano</option>
                                <option value="Tomate Cherry y Pesto">🍅 Tomate Cherry y Pesto</option>
                                <option value="Aceitunas">🫒 Aceitunas</option>
                            </select>

                            <!-- Promo dinámica: se llena desde el panel -->
                            <div class="promo-desc">
                                <label>🎁 Promo disponible:</label>
                                <select class="promo-select" onchange="calcularTotal()">
                                    <option value="">Sin promo</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Cantidad</label>
                            <select class="cantidad-select" required onchange="calcularTotal()">
                                <option value="1">1</option><option value="2">2</option>
                                <option value="3">3</option><option value="4">4</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="button" class="add-item-btn" onclick="agregarItem()">+ Agregar otro producto</button>

                <div class="total-price" id="totalTexto">Total: $0</div>
            </div>

            <div class="form-group">
                <label for="aclaraciones">Aclaraciones adicionales (Opcional)</label>
                <textarea id="aclaraciones" name="aclaraciones" placeholder="Si necesitás agregar algo más, escribilo acá..."></textarea>
            </div>

            <button type="submit">Confirmar Pedido</button>
        </form>
    </div>

    <div id="modalExito" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">🌿</div>
            <h2>¡Pedido Confirmado!</h2>
            <p>Recibimos tu pedido correctamente. En breve te vamos a escribir por WhatsApp para coordinar la entrega y el pago.</p>
            <button class="modal-btn" onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzMcf4pCj2zwG3VzOkBPJsaLZkqmzqm6iRZyq7D5H6WA6HaTWJbYL_0q8vC-koL4MYy/exec";

        // ─── Promos dinámicas desde el panel ──────────────────────────────────
        const PROMOS_URL = "https://raw.githubusercontent.com/sofivogelman/focacciapanel/main/promos.json";
        let PROMOS_ACTIVAS = [];

        async function cargarPromos() {
            try {
                const data = await fetch(PROMOS_URL + '?t=' + Date.now()).then(r => r.json());
                PROMOS_ACTIVAS = (data.promos || []).filter(function(p) { return p.active; });

                // Agregar promos con esFormato como opciones de formato
                var promosFormato = PROMOS_ACTIVAS.filter(function(p) { return p.esFormato; });
                document.querySelectorAll('.formato-select').forEach(function(sel) {
                    sel.querySelectorAll('.promo-formato-opt').forEach(function(o) { o.remove(); });
                    promosFormato.forEach(function(p) {
                        var opt = document.createElement('option');
                        opt.value     = p.name;
                        opt.className = 'promo-formato-opt';
                        opt.textContent = p.name + (p.price ? ' - $' + p.price.toLocaleString('es-AR') : '');
                        sel.appendChild(opt);
                    });
                });

                document.querySelectorAll('.order-item').forEach(function(item) {
                    var fmt = item.querySelector('.formato-select').value;
                    if (fmt) actualizarPromoSelect(item, fmt);
                });
            } catch (e) {
                console.warn('No se pudieron cargar las promos:', e);
            }
        }

        function promosParaFormato(formato) {
            return PROMOS_ACTIVAS.filter(p => {
                if (!p.items || p.items.length === 0) return true;
                return p.items.some(it => (it.format || '').toLowerCase() === (formato || '').toLowerCase());
            });
        }

        function actualizarPromoSelect(orderItem, formato) {
            const promoDiv    = orderItem.querySelector('.promo-desc:not(.formato-info-card)');
            const promoSelect = orderItem.querySelector('.promo-select');
            if (!promoDiv || !promoSelect) return;

            const promos = promosParaFormato(formato);
            if (!promos.length) {
                promoDiv.style.display = 'none';
                promoSelect.value = '';
                return;
            }

            promoSelect.innerHTML = '<option value="">Sin promo</option>' +
                promos.map(function(p) {
                    var precio = p.price > 0 ? ' (+$' + p.price.toLocaleString('es-AR') + ')' : ' (incluida)';
                    var desc   = p.tipo ? p.name + ' — ' + p.tipo + precio : p.name + precio;
                    return '<option value="' + p.name + '">' + desc + '</option>';
                }).join('');

            promoDiv.style.display = 'block';
        }
        // ──────────────────────────────────────────────────────────────────────

        function manejarCambioZona(selectElement) {
            const container = document.getElementById('barrioEspecificoContainer');
            const input = document.getElementById('barrioEspecifico');

            if (selectElement.value === 'Barrio de Villa Nueva' || selectElement.value === 'Otro') {
                container.style.display = 'block';
                input.setAttribute('required', 'required');
            } else {
                container.style.display = 'none';
                input.removeAttribute('required');
                input.value = '';
            }
        }

        function manejarCambioFormato(selectElement) {
            var item        = selectElement.closest('.order-item');
            var formato     = selectElement.value;
            var promoFmt    = PROMOS_ACTIVAS.find(function(p) { return p.esFormato && p.name === formato; });
            var saborGroup  = item.querySelector('.sabor-group');
            var infoCard    = item.querySelector('.formato-info-card');

            if (!infoCard) {
                infoCard = document.createElement('div');
                infoCard.className = 'formato-info-card promo-desc';
                infoCard.style.display = 'none';
                selectElement.closest('.form-group').after(infoCard);
            }

            if (promoFmt) {
                // Ocultar sabor, mostrar tarjeta descriptiva
                if (saborGroup) {
                    saborGroup.style.display = 'none';
                    saborGroup.querySelectorAll('select').forEach(function(s) { s.removeAttribute('required'); });
                }
                var desc = promoFmt.notes || promoFmt.tipo || '';
                infoCard.innerHTML =
                    '<label>🎁 ' + promoFmt.name + '</label>' +
                    (desc ? '<p style="margin:6px 0 0 0;font-size:13px;color:var(--dark-green)">' + desc + '</p>' : '') +
                    (promoFmt.price ? '<p style="margin:6px 0 0 0;font-weight:600">Precio: $' + promoFmt.price.toLocaleString('es-AR') + '</p>' : '');
                infoCard.style.display = 'block';
                // Ocultar promo dropdown normal
                var promoDiv = item.querySelector('.promo-desc:not(.formato-info-card)');
                if (promoDiv) promoDiv.style.display = 'none';
            } else {
                // Mostrar sabor, ocultar tarjeta
                if (saborGroup) {
                    saborGroup.style.display = 'block';
                    var saborSel = saborGroup.querySelector('.sabor-select');
                    if (saborSel) saborSel.setAttribute('required', 'required');
                }
                infoCard.style.display = 'none';
                actualizarPromoSelect(item, formato);
            }
            calcularTotal();
        }

        function calcularTotal() {
            let total = 0;
            const items = document.querySelectorAll('.order-item');

            items.forEach(function(item) {
                const formato   = item.querySelector('.formato-select').value;
                const cantidad  = parseInt(item.querySelector('.cantidad-select').value) || 1;
                const promoVal  = item.querySelector('.promo-select') ? item.querySelector('.promo-select').value : '';
                const promoFmt  = PROMOS_ACTIVAS.find(function(p) { return p.esFormato && p.name === formato; });

                let precioUnitario = 0;
                if (promoFmt) {
                    precioUnitario = promoFmt.price || 0;
                } else if (formato === 'Individual') {
                    precioUnitario = 4200;
                } else if (formato === 'Familiar') {
                    precioUnitario = 12000;
                }

                total += (precioUnitario * cantidad);

                if (promoVal) {
                    var promo = PROMOS_ACTIVAS.find(function(p) { return p.name === promoVal; });
                    if (promo && promo.price > 0) total += promo.price * cantidad;
                }
            });

            document.getElementById('totalTexto').innerText = total > 0 ? "Total: $" + total.toLocaleString('es-AR') : "Total: $0";
        }

        function agregarItem() {
            const container = document.getElementById('items-container');
            const primerItem = container.querySelector('.order-item');
            const nuevoItem = primerItem.cloneNode(true);

            nuevoItem.querySelector('.formato-select').value = "";

            const saborSelect = nuevoItem.querySelector('.sabor-select');
            saborSelect.value = "";
            saborSelect.style.display = 'block';
            saborSelect.setAttribute('required', 'required');

            nuevoItem.querySelector('.promo-desc').style.display = 'none';
            var promoSel = nuevoItem.querySelector('.promo-select');
            if (promoSel) promoSel.innerHTML = '<option value="">Sin promo</option>';
            nuevoItem.querySelector('.cantidad-select').value = "1";

            const btnEliminar = document.createElement('button');
            btnEliminar.type = 'button';
            btnEliminar.className = 'remove-btn';
            btnEliminar.innerHTML = '✖';
            btnEliminar.onclick = function() {
                nuevoItem.remove();
                calcularTotal();
            };
            nuevoItem.appendChild(btnEliminar);

            container.appendChild(nuevoItem);
        }

        function cerrarModal() {
            document.getElementById('modalExito').style.display = 'none';
            window.location.reload();
        }

        document.getElementById('pedidoForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerText = 'Enviando...';
            submitBtn.disabled = true;

            const itemsAgregados = [];
            document.querySelectorAll('.order-item').forEach(function(item) {
                const formato  = item.querySelector('.formato-select').value;
                const promoFmt = PROMOS_ACTIVAS.find(function(p) { return p.esFormato && p.name === formato; });
                let   sabor    = promoFmt ? (promoFmt.tipo || promoFmt.name) : item.querySelector('.sabor-select').value;
                const promoVal = item.querySelector('.promo-select') ? item.querySelector('.promo-select').value : '';

                if (!promoFmt && promoVal) sabor += ' (+ ' + promoVal + ')';

                itemsAgregados.push({
                    formato:  formato,
                    sabor:    sabor,
                    cantidad: item.querySelector('.cantidad-select').value
                });
            });

            const zonaSeleccionada = document.getElementById('zona').value;
            let zonaFinal = zonaSeleccionada;
            if (zonaSeleccionada === 'Barrio de Villa Nueva' || zonaSeleccionada === 'Otro') {
                const barrio = document.getElementById('barrioEspecifico').value;
                zonaFinal = zonaSeleccionada + " - " + barrio;
            }

            const data = {
                nombre:       document.getElementById('nombre').value,
                telefono:     document.getElementById('telefono').value,
                zona:         zonaFinal,
                dia:          "A coordinar",
                aclaraciones: document.getElementById('aclaraciones').value,
                total:        document.getElementById('totalTexto').innerText.replace("Total: ", ""),
                items:        itemsAgregados
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(function() {
                document.getElementById('modalExito').style.display = 'flex';
                submitBtn.innerText = 'Confirmar Pedido';
                submitBtn.disabled = false;
            })
            .catch(function(error) {
                alert('Hubo un error. Por favor, revisá tu conexión y volvé a intentar.');
                submitBtn.innerText = 'Confirmar Pedido';
                submitBtn.disabled = false;
            });
        });

        cargarPromos();
    </script>
</body>
</html>
